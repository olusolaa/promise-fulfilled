name: Deploy to GitHub Pages

# Give the workflow permission to write repository contents so it can push the gh-pages branch.
# If your repository or organization restricts GITHUB_TOKEN, you may need to create a personal
# access token (PAT) with `repo` scope and set it as a repository secret named DEPLOY_TOKEN.
permissions:
  contents: write

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # ensure the checkout action has credentials so the subsequent push will authenticate
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          # Prefer a deploy token if you created one; otherwise use the default GITHUB_TOKEN.
          # If you still get a 403, create a PAT with `repo` scope and add it as a repo secret named DEPLOY_TOKEN.
          github_token: ${{ secrets.DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
